<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sbogia Player</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #1e1e1e; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; }
        h1 { font-size: 1.5rem; text-align: center; color: #0088cc; margin-top: 0; }
        ul { list-style: none; padding: 0; margin: 0 0 20px 0; max-height: 300px; overflow-y: auto; }
        li { padding: 12px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
        li:hover { background-color: #2a2a2a; }
        .title { font-weight: bold; display: block; }
        .artist { font-size: 0.85rem; color: #aaa; }
        audio { width: 100%; }
        .empty { text-align: center; color: #888; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Telegram Music Player</h1>
        <ul id="playlist"><li class="empty">Caricamento brani...</li></ul>
        <audio id="audio-player" controls autoplay></audio>
    </div>
    <script>
        async function loadPlaylist() {
            try {
                const res = await fetch('/api/playlist');
                const tracks = await res.json();
                const list = document.getElementById('playlist');
                const player = document.getElementById('audio-player');
                list.innerHTML = '';
                if (tracks.length === 0) {
                    list.innerHTML = '<li class="empty">Nessun brano trovato.</li>';
                    return;
                }
                tracks.forEach((track, index) => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="title">${track.title}</span><span class="artist">${track.artist}</span>`;
                    li.onclick = () => { player.src = track.url; player.play(); };
                    list.appendChild(li);
                    if (index === 0) player.src = track.url;
                });
            } catch (err) {
                document.getElementById('playlist').innerHTML = '<li class="empty">Errore caricamento.</li>';
            }
        }
        loadPlaylist();
    </script>
</body>
</html>
