<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SboGiA Player</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .player-container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        h1 {
            text-align: center;
            color: #2e8b57;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: #004225;
        }
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            height: 250px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            background-color: #181818;
        }
        .playlist li {
            padding: 10px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
        }
        .playlist li:last-child {
            border-bottom: none;
        }
        .playlist li:hover {
            background-color: #2a2a2a;
        }
        .playlist li.active {
            background-color: #004225;
            color: #fff;
        }
        .song-title {
            font-weight: bold;
            display: block;
        }
        .song-artist {
            font-size: 0.85em;
            color: #aaa;
        }
        .playlist li.active .song-artist {
            color: #ddd;
        }
        .status-msg {
            padding: 15px;
            text-align: center;
            color: #888;
            font-style: italic;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-control {
            background-color: #004225;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-control:hover {
            background-color: #002b18;
        }
        .btn-control.active-mode {
            background-color: #2e8b57;
            box-shadow: 0 0 8px rgba(46, 139, 87, 0.6);
        }
        audio {
            width: 100%;
            border-radius: 30px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h1>SboGiA Player</h1>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cerca brano o artista...">

    <ul class="playlist" id="playlist">
        <div id="statusMsg" class="status-msg">Caricamento brani dal satellite...</div>
    </ul>

    <div class="controls">
        <button class="btn-control" id="shuffleBtn">🔀 Casuale</button>
        <button class="btn-control" id="prevBtn">⏮️ Indietro</button>
        <button class="btn-control" id="nextBtn">Avanti ⏭️</button>
        <button class="btn-control" id="repeatBtn">🔁 Ripeti</button>
    </div>

    <audio id="audioPlayer" controls></audio>
</div>

<script>
    const player = document.getElementById('audioPlayer');
    const playlistUl = document.getElementById('playlist');
    const searchInput = document.getElementById('searchInput');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const statusMsg = document.getElementById('statusMsg');

    let songsData = [];
    let items = [];
    let currentIndex = 0;
    let isShuffle = false;
    let isRepeat = false;

    async function loadSongs() {
        try {
            const response = await fetch('/api/playlist');
            songsData = await response.json();

            if (!songsData || songsData.length === 0) {
                statusMsg.textContent = 'Nessun brano trovato nel canale.';
                return;
            }

            // Invertiamo per avere gli ultimi aggiunti in alto
            songsData.reverse();

            playlistUl.innerHTML = '';
            
            songsData.forEach((song, index) => {
                const li = document.createElement('li');
                li.setAttribute('data-src', song.url);
                li.setAttribute('data-title', song.title);
                li.setAttribute('data-artist', song.artist);

                li.innerHTML = `
                    <span class="song-title">${song.title}</span>
                    <span class="song-artist">${song.artist}</span>
                `;

                li.addEventListener('click', () => playSong(index));
                playlistUl.appendChild(li);
            });

            items = Array.from(playlistUl.querySelectorAll('li'));

            if (items.length > 0) {
                playSong(0, false); // Prepara il primo brano senza avviarlo automaticamente
            }
        } catch (error) {
            console.error(error);
            statusMsg.textContent = 'Errore durante il caricamento dei brani.';
        }
    }

    function getVisibleItems() {
        return items.filter(item => item.style.display !== 'none');
    }

    function updateMediaSession(title, artist) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title || 'Brano Sconosciuto',
                artist: artist || 'Artista Sconosciuto',
                album: 'SboGiA Player'
            });

            navigator.mediaSession.setActionHandler('play', () => player.play());
            navigator.mediaSession.setActionHandler('pause', () => player.pause());
            navigator.mediaSession.setActionHandler('previoustrack', playPrev);
            navigator.mediaSession.setActionHandler('nexttrack', playNext);
        }
    }

    function playSong(index, autoPlay = true) {
        if (index < 0 || index >= items.length) return;

        items.forEach(li => li.classList.remove('active'));

        const selected = items[index];
        selected.classList.add('active');
        selected.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        const title = selected.getAttribute('data-title');
        const artist = selected.getAttribute('data-artist');

        player.src = selected.getAttribute('data-src');
        currentIndex = index;

        if (autoPlay) {
            player.play().catch(() => {});
        }

        updateMediaSession(title, artist);
    }

    function playNext() {
        if (isRepeat) {
            playSong(currentIndex);
            return;
        }

        const visible = getVisibleItems();
        if (visible.length === 0) return;

        if (isShuffle) {
            const randomIndex = Math.floor(Math.random() * visible.length);
            const targetItem = visible[randomIndex];
            playSong(items.indexOf(targetItem));
        } else {
            const currentVisibleIndex = visible.indexOf(items[currentIndex]);
            let nextVisibleIndex = currentVisibleIndex + 1;
            if (nextVisibleIndex >= visible.length) nextVisibleIndex = 0;
            playSong(items.indexOf(visible[nextVisibleIndex]));
        }
    }

    function playPrev() {
        const visible = getVisibleItems();
        if (visible.length === 0) return;

        const currentVisibleIndex = visible.indexOf(items[currentIndex]);
        let prevVisibleIndex = currentVisibleIndex - 1;
        if (prevVisibleIndex < 0) prevVisibleIndex = visible.length - 1;
        playSong(items.indexOf(visible[prevVisibleIndex]));
    }

    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrev);

    shuffleBtn.addEventListener('click', () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active-mode', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active-mode', isRepeat);
    });

    player.addEventListener('ended', playNext);

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        let visibleCount = 0;

        items.forEach(item => {
            const title = (item.getAttribute('data-title') || '').toLowerCase();
            const artist = (item.getAttribute('data-artist') || '').toLowerCase();

            if (title.includes(query) || artist.includes(query)) {
                item.style.display = '';
                visibleCount++;
            } else {
                item.style.display = 'none';
            }
        });
    });

    // Carica le canzoni via API appena la pagina è pronta
    loadSongs();
</script>

</body>
</html>
