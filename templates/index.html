<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sbogia Player 1972</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-layout {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        @media (max-width: 768px) {
            .app-layout {
                flex-direction: column;
            }
        }

        /* Sezione Sinistra: Sbogia Player 1972 */
        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding-right: 15px;
            border-right: 1px solid #2a2a2a;
        }
        @media (max-width: 768px) {
            .player-side {
                border-right: none;
                border-bottom: 1px solid #2a2a2a;
                padding-right: 0;
                padding-bottom: 20px;
            }
        }

        .sbogia-wrapper {
            background: #121212;
            border-radius: 8px;
            padding: 16px 18px 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            border: 1px solid #2a2a2a;
        }

        .sbogia-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .sbogia-brand {
            font-weight: 600;
        }

        .sbogia-label {
            opacity: 0.7;
        }

        .sbogia-display {
            background: #050505;
            border-radius: 4px;
            padding: 10px 14px;
            border: 1px solid #2a2a2a;
        }

        .sbogia-display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .sbogia-mode {
            color: #c5c5c5;
            font-weight: 500;
        }

        .sbogia-info {
            color: #e8f0c0;
            font-weight: 500;
            text-align: center;
            flex: 1;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sbogia-channel {
            color: #c5c5c5;
        }

        /* Equalizer stile Sony */
        .sbogia-eq {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .sbogia-eq-side {
            width: 8px;
            height: 42px;
            background: linear-gradient(to bottom, #ff3b3b, #aa1515);
            border-radius: 2px;
            position: relative;
            box-shadow: 0 0 6px rgba(255, 60, 60, 0.5);
        }

        .sbogia-eq-side::before,
        .sbogia-eq-side::after {
            content: "";
            position: absolute;
            left: 50%;
            width: 2px;
            height: 2px;
            background: #ffffe0;
            transform: translateX(-50%);
        }

        .sbogia-eq-side::before {
            top: 6px;
        }
        .sbogia-eq-side::after {
            bottom: 6px;
        }

        .sbogia-eq-columns {
            flex: 1;
            display: flex;
            justify-content: space-between;
        }

        .sbogia-eq-col {
            width: 8%;
            height: 42px;
            display: flex;
            flex-direction: column-reverse;
            justify-content: flex-start;
            gap: 1px;
            transform-origin: bottom;
            animation: sbogiaEqPulse 1.8s infinite ease-in-out;
        }

        .sbogia-eq-col::before {
            content: "";
            display: block;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(
                to top,
                #bfc4a5 10%,
                #bfc4a5 10%,
                transparent 10%
            );
            background-size: 100% 3px;
            background-repeat: repeat-y;
            border-radius: 1px;
            opacity: 0.85;
        }

        @keyframes sbogiaEqPulse {
            0%   { transform: scaleY(0.6); }
            25%  { transform: scaleY(0.9); }
            50%  { transform: scaleY(0.5); }
            75%  { transform: scaleY(0.8); }
            100% { transform: scaleY(0.7); }
        }

        .sbogia-eq-col:nth-child(2)  { animation-delay: 0.2s; }
        .sbogia-eq-col:nth-child(3)  { animation-delay: 0.4s; }
        .sbogia-eq-col:nth-child(4)  { animation-delay: 0.6s; }
        .sbogia-eq-col:nth-child(5)  { animation-delay: 0.8s; }
        .sbogia-eq-col:nth-child(6)  { animation-delay: 1.0s; }
        .sbogia-eq-col:nth-child(7)  { animation-delay: 1.2s; }
        .sbogia-eq-col:nth-child(8)  { animation-delay: 1.4s; }

        /* Controlli principali */
        .sbogia-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            margin-bottom: 8px;
        }

        .sbogia-btn {
            background: #202020;
            border: 1px solid #404040;
            color: #e5e5e5;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 2px;
            cursor: pointer;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .sbogia-btn-small {
            padding: 5px 8px;
        }

        .sbogia-btn-tiny {
            padding: 3px 6px;
            font-size: 10px;
        }

        .sbogia-btn:hover {
            background: #2a2a2a;
        }

        .sbogia-btn:active {
            background: #101010;
        }

        .sbogia-btn.active-mode {
            background-color: #2e8b57;
            box-shadow: 0 0 8px rgba(46, 139, 87, 0.6);
        }

        /* Parte inferiore: volume + source + audio */
        .sbogia-bottom {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sbogia-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .sbogia-volume-block,
        .sbogia-source-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sbogia-volume-label,
        .sbogia-source-label {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .sbogia-volume-knob {
            width: 120px;
            height: 32px;
            border-radius: 16px;
            background: #1a1a1a;
            border: 1px solid #303030;
            display: flex;
            align-items: center;
            padding: 0 8px;
        }

        #sbogia-volume-range {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }

        #sbogia-volume-range::-webkit-slider-runnable-track {
            height: 3px;
            background: #c0c0c0;
        }

        #sbogia-volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f5f5f5;
            border: 1px solid #888;
            margin-top: -4px;
        }

        #sbogia-volume-range::-moz-range-track {
            height: 3px;
            background: #c0c0c0;
        }

        #sbogia-volume-range::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f5f5f5;
            border: 1px solid #888;
        }

        .sbogia-source-buttons {
            display: flex;
            gap: 4px;
        }

        .sbogia-audio-wrap audio {
            width: 100%;
            border-radius: 30px;
            margin-top: 6px;
        }

        /* Sezione Destra: Copertine / Lista (come prima) */
        .content-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus {
            border-color: #2e8b57;
        }
        .debug-link {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }
        .debug-link a {
            color: #2e8b57;
            text-decoration: none;
        }
        .debug-link a:hover {
            text-decoration: underline;
        }
        .playlist {
            list-style: none;
            padding: 0;
            margin: 0;
            height: 380px;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background-color: #181818;
        }
        .playlist li {
            padding: 12px 15px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
        }
        .playlist li:last-child {
            border-bottom: none;
        }
        .playlist li:hover {
            background-color: #2a2a2a;
        }
        .playlist li.active {
            background-color: #004225;
            color: #fff;
        }
        .song-title {
            font-weight: bold;
            display: block;
        }
        .song-artist {
            font-size: 0.85em;
            color: #aaa;
            margin-top: 3px;
        }
        .playlist li.active .song-artist {
            color: #ddd;
        }
        .status-msg {
            padding: 20px;
            text-align: center;
            color: #ff6b6b;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="app-layout">
    <!-- SINISTRA: Sbogia Player 1972 -->
    <div class="player-side">
        <div class="sbogia-wrapper">
            <div class="sbogia-top">
                <span class="sbogia-brand">Sbogia Player 1972</span>
                <span class="sbogia-label">DIGITAL HI-FI SYSTEM</span>
            </div>

            <div class="sbogia-display">
                <div class="sbogia-display-header">
                    <span class="sbogia-mode" id="sbogia-mode">TRACK</span>
                    <span class="sbogia-info" id="currentTitle">Seleziona un brano</span>
                    <span class="sbogia-channel" id="sbogia-channel">CH A</span>
                </div>

                <div class="sbogia-eq">
                    <div class="sbogia-eq-side sbogia-eq-side-left"></div>

                    <div class="sbogia-eq-columns">
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                        <div class="sbogia-eq-col"></div>
                    </div>

                    <div class="sbogia-eq-side sbogia-eq-side-right"></div>
                </div>
            </div>

            <div class="sbogia-controls">
                <button class="sbogia-btn sbogia-btn-small" id="prevBtn">◀ PREV</button>
                <button class="sbogia-btn sbogia-btn-small" id="playBtn">▶ PLAY / PAUSE</button>
                <button class="sbogia-btn sbogia-btn-small" id="nextBtn">NEXT ▶</button>
                <button class="sbogia-btn sbogia-btn-small" id="shuffleBtn">SHUFFLE</button>
                <button class="sbogia-btn sbogia-btn-small" id="repeatBtn">REPEAT</button>
            </div>

            <div class="sbogia-bottom">
                <div class="sbogia-bottom-row">
                    <div class="sbogia-volume-block">
                        <span class="sbogia-volume-label">VOLUME</span>
                        <div class="sbogia-volume-knob">
                            <input type="range" min="0" max="100" value="70" id="sbogia-volume-range">
                        </div>
                    </div>

                    <div class="sbogia-source-block">
                        <span class="sbogia-source-label">SOURCE</span>
                        <div class="sbogia-source-buttons">
                            <button class="sbogia-btn sbogia-btn-tiny" id="sbogia-source-a">CH A</button>
                            <button class="sbogia-btn sbogia-btn-tiny" id="sbogia-source-b">CH B</button>
                        </div>
                    </div>
                </div>

                <div class="sbogia-audio-wrap">
                    <audio id="audioPlayer" controls></audio>
                </div>
            </div>
        </div>
    </div>

    <!-- DESTRA: LISTA E RICERCA (come prima) -->
    <div class="content-side">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Cerca brano o artista...">
        <div class="debug-link">
            Stato servizio: <a href="/api/debug" target="_blank">/api/debug</a>
        </div>

        <ul class="playlist" id="playlist">
            <div id="statusMsg" class="status-msg">Caricamento brani dai canali...</div>
        </ul>
    </div>
</div>

<script>

    const playlistUl = document.getElementById('playlist');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const statusMsg = document.getElementById('statusMsg');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.createElement('span); // non serve più come elemento separato

    const volumeRange = document.getElementById('sbogia-volume-range');
    const sourceABtn = document.getElementById('sbogia-source-a');
    const sourceBBtn = document.getElementById('sbogia-source-b');
    const channelDisplay = document.getElementById('sbogia-channel');

    let songsData = [];
    let items = [];
    let currentIndex = 0;
    let isShuffle = false;
    let isRepeat = false;
    let currentSource = 'A'; // per ora solo visuale

    function setError(message) {
        playlistUl.innerHTML = '';
        const div = document.createElement('div');
        div.id = 'statusMsg';
        div.className = 'status-msg';
        div.textContent = message;
        playlistUl.appendChild(div);
    }

        try {
            const response = await fetch('/api/playlist');

            if (!response.ok) {
                throw new Error(`Errore HTTP ${response.status}`);
            }

            songsData = await response.json();

            if (!songsData || songsData.length === 0) {
                setError('Lista brani vuota. Controlla i canali Telegram o /api/debug.');
                return;
            }

            songsData.reverse();
            playlistUl.innerHTML = '';

            songsData.for
