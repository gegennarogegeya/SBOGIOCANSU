<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricerca Canale</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        input, button { padding: 10px; font-size: 16px; margin: 5px 0; }
        input[type="text"] { width: 70%; }
        .result-item { margin: 10px 0; padding: 10px; background: #222; border-radius: 5px; }
        a { color: #1db954; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Cerca nel Canale</h2>
    <input type="text" id="searchInput" placeholder="Inserisci il titolo del brano...">
    <button onclick="searchChannel()">Cerca</button>

    <div id="results"></div>

    <script>
        const API_KEY = 'LA_TUA_API_KEY';
        const CHANNEL_ID = 'IL_TUO_CHANNEL_ID'; // oppure usa playlistId se preferisci una playlist specifica

        async function searchChannel() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = 'Ricerca in corso...';

            if (!query) {
                resultsDiv.innerHTML = 'Inserisci un termine di ricerca.';
                return;
            }

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    resultsDiv.innerHTML = 'Nessun brano trovato nel canale.';
                    return;
                }

                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;

                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `<a href="${videoUrl}" target="_blank">${title}</a>`;
                    resultsDiv.appendChild(div);
                });
            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = 'Errore durante il recupero dei dati dal canale.';
            }
        }
    </script>
</body>
</html>
